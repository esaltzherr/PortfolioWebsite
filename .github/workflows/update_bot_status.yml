name: Update Trading Bot Status

on:
  schedule:
    # Run every 15 minutes off-peak throughout pre-market, market hours, and evening (13:00 - 23:59 UTC, Mon-Fri)
    - cron: '3,18,33,48 13-23 * * 1-5'
    # Evening standby check at 6:00 PM PT (01:00 UTC) and 9:00 PM PT (04:00 UTC)
    - cron: '5 1,4 * * 2-6'
  workflow_dispatch:

jobs:
  update-status:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install alpaca-py

      - name: Fetch Alpaca status & generate JSON
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          python scripts/generate_status.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bot_status.json reports/
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update bot status [skip ci]" && git push)

