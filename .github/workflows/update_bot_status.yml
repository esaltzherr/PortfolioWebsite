name: Update Trading Bot Status

on:
  schedule:
    # Run at 13:30, 14:00, 16:00, 18:00, 20:00, 21:00 UTC Monday-Friday (covering pre-market, open, mid-day, and close)
    - cron: '30 13,14,16,18,20,21 * * 1-5'
  workflow_dispatch: # Allows manual trigger anytime from the GitHub Actions web UI

jobs:
  update-status:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          pip install alpaca-py

      - name: Fetch Alpaca status & generate JSON
        env:
          ALPACA_API_KEY: ${{ secrets.ALPACA_API_KEY }}
          ALPACA_SECRET_KEY: ${{ secrets.ALPACA_SECRET_KEY }}
        run: |
          python scripts/generate_status.py

      - name: Commit and push if changed
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add bot_status.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto-update bot status [skip ci]" && git push)
